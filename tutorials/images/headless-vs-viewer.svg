<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-labelledby="title desc">
  <title id="title">Headless 与 Viewer 两种运行方式</title><desc id="desc">同一个 MuJoCo 物理循环分别进入无渲染的快速训练路径和同步渲染的人工观察路径</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker><style>.b{fill:#fff;stroke:#94A3B8;stroke-width:2}.p{fill:#E0E7FF;stroke:#6366F1;stroke-width:2}.g{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.o{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.t{font:700 18px sans-serif;fill:#172033}.s{font:14px sans-serif;fill:#475569}.l{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#a)}</style></defs>
  <rect width="980" height="380" rx="18" fill="#F8FAFC"/><text x="38" y="42" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">相同物理循环，不同运行目标</text>
  <g transform="translate(55 139)"><rect class="p" width="220" height="96" rx="14"/><text class="t" x="110" y="40" text-anchor="middle">MuJoCo 物理循环</text><text class="s" x="110" y="66" text-anchor="middle">相同模型与 timestep</text></g>
  <path class="l" d="M275 170C340 170 335 102 405 102"/><path class="l" d="M275 204C340 204 335 286 405 286"/>
  <g transform="translate(405 56)"><rect class="g" width="220" height="92" rx="14"/><text class="t" x="110" y="38" text-anchor="middle">Headless</text><text class="s" x="110" y="64" text-anchor="middle">不渲染、不 sleep</text></g>
  <g transform="translate(405 240)"><rect class="o" width="220" height="92" rx="14"/><text class="t" x="110" y="38" text-anchor="middle">Viewer</text><text class="s" x="110" y="64" text-anchor="middle">sync + 可选 sleep</text></g>
  <path class="l" d="M625 102H705"/><path class="l" d="M625 286H705"/>
  <g transform="translate(705 56)"><rect class="b" width="220" height="92" rx="14"/><text class="t" x="110" y="38" text-anchor="middle">训练 / 自动检查</text><text class="s" x="110" y="64" text-anchor="middle">尽可能快地推进</text></g>
  <g transform="translate(705 240)"><rect class="b" width="220" height="92" rx="14"/><text class="t" x="110" y="38" text-anchor="middle">人工观察</text><text class="s" x="110" y="64" text-anchor="middle">接近实时播放</text></g>
</svg>
