<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220" role="img" aria-labelledby="title desc">
  <title id="title">T800 教程学习路径</title>
  <desc id="desc">从 MuJoCo 模型到理解 SDK 部署契约的八阶段学习路径</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748B"/></marker>
    <style>.box{fill:#fff;stroke:#94A3B8;stroke-width:1.5}.accent{fill:#E0E7FF;stroke:#6366F1;stroke-width:2}.n{font:700 13px sans-serif;fill:#6366F1}.t{font:600 15px sans-serif;fill:#172033}.line{stroke:#64748B;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1400" height="220" rx="18" fill="url(#bg)"/>
  <text x="36" y="40" font-family="sans-serif" font-size="20" font-weight="700" fill="#172033">从仿真基础到策略部署</text>
  <g transform="translate(35 76)">
    <path class="line" d="M150 38H171"/><path class="line" d="M315 38H336"/><path class="line" d="M480 38H501"/><path class="line" d="M645 38H666"/><path class="line" d="M810 38H831"/><path class="line" d="M975 38H996"/><path class="line" d="M1140 38H1161"/>
    <g><rect class="accent" width="150" height="76" rx="12"/><text class="n" x="14" y="23">01</text><text class="t" x="75" y="48" text-anchor="middle">MuJoCo 模型</text></g>
    <g transform="translate(165)"><rect class="box" width="150" height="76" rx="12"/><text class="n" x="14" y="23">02</text><text class="t" x="75" y="40" text-anchor="middle">Joint 与</text><text class="t" x="75" y="59" text-anchor="middle">Actuator</text></g>
    <g transform="translate(330)"><rect class="box" width="150" height="76" rx="12"/><text class="n" x="14" y="23">03</text><text class="t" x="75" y="48" text-anchor="middle">原始力矩</text></g>
    <g transform="translate(495)"><rect class="box" width="150" height="76" rx="12"/><text class="n" x="14" y="23">04</text><text class="t" x="75" y="40" text-anchor="middle">PD、PID</text><text class="t" x="75" y="59" text-anchor="middle">与前馈</text></g>
    <g transform="translate(660)"><rect class="box" width="150" height="76" rx="12"/><text class="n" x="14" y="23">05</text><text class="t" x="75" y="40" text-anchor="middle">T800 PD</text><text class="t" x="75" y="59" text-anchor="middle">站立</text></g>
    <g transform="translate(825)"><rect class="box" width="150" height="76" rx="12"/><text class="n" x="14" y="23">06</text><text class="t" x="75" y="40" text-anchor="middle">Gymnasium</text><text class="t" x="75" y="59" text-anchor="middle">环境</text></g>
    <g transform="translate(990)"><rect class="box" width="150" height="76" rx="12"/><text class="n" x="14" y="23">07</text><text class="t" x="75" y="40" text-anchor="middle">PPO 训练</text><text class="t" x="75" y="59" text-anchor="middle">与站立</text></g>
    <g transform="translate(1155)"><rect class="accent" width="175" height="76" rx="12"/><text class="n" x="14" y="23">08</text><text class="t" x="87.5" y="40" text-anchor="middle">理解 SDK</text><text class="t" x="87.5" y="59" text-anchor="middle">部署契约</text></g>
  </g>
</svg>
