<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="600" viewBox="0 0 1050 600" role="img" aria-labelledby="title desc">
  <title id="title">条件积分防饱和流程</title><desc id="desc">候选积分经过状态限幅和候选力矩计算，根据输出是否饱和及误差是否加重饱和，决定接受或保持积分</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker><style>.b{fill:#fff;stroke:#94A3B8;stroke-width:2}.p{fill:#E0E7FF;stroke:#6366F1;stroke-width:2}.g{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.o{fill:#FFEDD5;stroke:#EA580C;stroke-width:2}.r{fill:#FEE2E2;stroke:#DC2626;stroke-width:2}.t{font:700 16px sans-serif;fill:#172033}.s{font:13px sans-serif;fill:#475569}.l{fill:none;stroke:#64748B;stroke-width:2;marker-end:url(#a)}.yes{font:700 13px sans-serif;fill:#DC2626}.no{font:700 13px sans-serif;fill:#16A34A}</style></defs>
  <rect width="1050" height="600" rx="18" fill="#F8FAFC"/><text x="38" y="42" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">Anti-windup：只在积分有助于退出饱和时更新</text>
  <g transform="translate(45 110)"><rect class="b" width="150" height="72" rx="12"/><text class="t" x="75" y="43" text-anchor="middle">当前误差</text></g><path class="l" d="M195 146H245"/>
  <g transform="translate(245 110)"><rect class="p" width="170" height="72" rx="12"/><text class="t" x="85" y="31" text-anchor="middle">计算候选积分</text><text class="s" x="85" y="52" text-anchor="middle">integral_candidate</text></g><path class="l" d="M415 146H465"/>
  <g transform="translate(465 110)"><rect class="o" width="170" height="72" rx="12"/><text class="t" x="85" y="31" text-anchor="middle">积分状态限幅</text><text class="s" x="85" y="52" text-anchor="middle">防止无限累积</text></g><path class="l" d="M635 146H685"/>
  <g transform="translate(685 110)"><rect class="p" width="185" height="72" rx="12"/><text class="t" x="92.5" y="31" text-anchor="middle">计算候选力矩</text><text class="s" x="92.5" y="52" text-anchor="middle">tau_candidate</text></g>
  <path class="l" d="M778 182V230"/><g transform="translate(693 230)"><path class="o" d="M85 0L170 62L85 124L0 62Z"/><text class="t" x="85" y="58" text-anchor="middle">输出是否</text><text class="t" x="85" y="79" text-anchor="middle">饱和？</text></g>
  <path class="l" d="M693 292H580"/><text class="no" x="634" y="278">否</text><g transform="translate(395 256)"><rect class="g" width="185" height="72" rx="12"/><text class="t" x="92.5" y="43" text-anchor="middle">接受候选积分</text></g>
  <path class="l" d="M778 354V395"/><text class="yes" x="792" y="382">是</text><g transform="translate(693 395)"><path class="r" d="M85 0L170 62L85 124L0 62Z"/><text class="t" x="85" y="58" text-anchor="middle">误差是否加重</text><text class="t" x="85" y="79" text-anchor="middle">饱和？</text></g>
  <path class="l" d="M693 457H580"/><text class="no" x="634" y="443">否</text><path class="l" d="M487 328V500"/>
  <path class="l" d="M778 519V552H580"/><text class="yes" x="792" y="544">是</text><g transform="translate(395 516)"><rect class="r" width="185" height="60" rx="12"/><text class="t" x="92.5" y="36" text-anchor="middle">保持原积分</text></g>
  <g transform="translate(85 395)"><rect class="p" width="215" height="92" rx="12"/><text class="t" x="107.5" y="38" text-anchor="middle">重新计算并限幅</text><text class="s" x="107.5" y="63" text-anchor="middle">输出最终力矩</text></g>
  <path class="l" d="M395 292C345 292 330 418 300 430"/><path class="l" d="M395 546C330 546 335 468 300 455"/>
</svg>
