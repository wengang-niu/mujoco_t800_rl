<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">MuJoCo 模型、状态与步进关系</title><desc id="desc">MJCF 编译为只读模型，模型可创建多套独立状态，其中一套状态通过 mj_step 推进并产生新状态与传感器数据</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748B"/></marker><style>.b{fill:#fff;stroke:#94A3B8;stroke-width:2}.p{fill:#E0E7FF;stroke:#6366F1;stroke-width:2}.g{fill:#DCFCE7;stroke:#16A34A;stroke-width:2}.t{font:700 18px sans-serif;fill:#172033}.s{font:14px sans-serif;fill:#475569}.l{fill:none;stroke:#64748B;stroke-width:2.2;marker-end:url(#a)}.c{font:13px sans-serif;fill:#475569}</style></defs>
  <rect width="1100" height="430" rx="18" fill="#F8FAFC"/>
  <g transform="translate(45 165)"><rect class="b" width="160" height="88" rx="14"/><text class="t" x="80" y="38" text-anchor="middle">MJCF / XML</text><text class="s" x="80" y="62" text-anchor="middle">模型描述文件</text></g>
  <path class="l" d="M205 209H300"/><text class="c" x="252" y="194" text-anchor="middle">编译一次</text>
  <g transform="translate(300 165)"><rect class="p" width="180" height="88" rx="14"/><text class="t" x="90" y="38" text-anchor="middle">MjModel</text><text class="s" x="90" y="62" text-anchor="middle">只读模型</text></g>
  <path class="l" d="M480 195C535 195 525 98 585 98"/><path class="l" d="M480 223C535 223 525 320 585 320"/>
  <g transform="translate(585 52)"><rect class="g" width="210" height="92" rx="14"/><text class="t" x="105" y="37" text-anchor="middle">MjData A</text><text class="s" x="105" y="63" text-anchor="middle">qpos / qvel / ctrl</text></g>
  <g transform="translate(585 274)"><rect class="b" width="210" height="92" rx="14"/><text class="t" x="105" y="37" text-anchor="middle">MjData B</text><text class="s" x="105" y="63" text-anchor="middle">另一套独立状态</text></g>
  <path class="l" d="M795 98H880"/><text class="c" x="838" y="83" text-anchor="middle">ctrl + 当前状态</text>
  <g transform="translate(880 52)"><rect class="p" width="175" height="92" rx="14"/><text class="t" x="87.5" y="38" text-anchor="middle">mj_step</text><text class="s" x="87.5" y="63" text-anchor="middle">推进 0.002 s</text></g>
  <path class="l" d="M968 144V198C968 235 845 235 760 150"/><text class="c" x="922" y="220" text-anchor="middle">更新状态</text>
  <path class="l" d="M690 144V202"/><g transform="translate(585 202)"><rect class="b" width="210" height="52" rx="12"/><text class="s" x="105" y="31" text-anchor="middle">sensordata / 新状态</text></g>
  <text x="45" y="40" font-family="sans-serif" font-size="21" font-weight="700" fill="#172033">一个模型，多套独立状态</text>
</svg>
